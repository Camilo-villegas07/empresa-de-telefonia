<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="navegacion :: head"></head>
<body>
<div th:replace="navegacion :: navbar"></div>

<div class="container mt-4">
    <h2 th:text="${cliente.id} ? '✏️ Editar Cliente' : '➕ Nuevo Cliente'"></h2>
    <form th:action="@{/guardarCliente}" th:object="${cliente}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nombre completo *</label>
            <input type="text" th:field="*{nombre}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Cédula *</label>
            <input type="text" th:field="*{cedula}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Teléfono *</label>
            <input type="tel" th:field="*{telefono}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Dirección</label>
            <input type="text" th:field="*{direccion}" class="form-control">
        </div>
        <button type="submit" class="btn btn-success">💾 Guardar</button>
        <a href="/clientes" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
