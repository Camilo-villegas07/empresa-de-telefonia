<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="navegacion :: head"></head>
<body>
<div th:replace="navegacion :: navbar"></div>

<div class="container mt-4">
    <h2>📋 Gestión de Clientes</h2>
    <a href="/nuevoCliente" class="btn btn-primary mb-3">➕ Nuevo Cliente</a>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th><th>Nombre</th><th>Cédula</th><th>Teléfono</th><th>Dirección</th><th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="cliente : ${clientes}">
                <td th:text="${cliente.id}"></td>
                <td th:text="${cliente.nombre}"></td>
                <td th:text="${cliente.cedula}"></td>
                <td th:text="${cliente.telefono}"></td>
                <td th:text="${cliente.direccion}"></td>
                <td>
                    <a th:href="@{/editarCliente/{id}(id=${cliente.id})}" class="btn btn-sm btn-warning">✏️ Editar</a>
                    <a th:href="@{/eliminarCliente/{id}(id=${cliente.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar cliente?')">🗑️ Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
