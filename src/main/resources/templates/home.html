<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="navegacion :: head">
    <title>Inicio - Cercanía Móvil</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div th:replace="navegacion :: navbar"></div>

<div class="hero-section">
    <div class="container">
        <h1 class="hero-title">
            <img src="/images/titulo.jpeg"  class="hero-logo">
        </h1>
    </div>
</div>

<div class="container cards-container">
    <div class="row g-4">
        <div class="col-md-6 col-lg-3">
            <a href="/clientes" class="text-decoration-none">
                <div class="card card-custom card-clientes">
                    <div class="card-body">
                        <i class="fas fa-users card-icon"></i>
                        <h3 class="card-title">Clientes</h3>
                        <p class="card-description">Gestiona la información de tus clientes</p>
                        <button class="card-btn">Ir a Clientes</button>
                    </div>
                </div>
            </a>
        </div>
        
        <div class="col-md-6 col-lg-3">
            <a href="/vendedores" class="text-decoration-none">
                <div class="card card-custom card-vendedores">
                    <div class="card-body">
                        <i class="fas fa-user-tie card-icon"></i>
                        <h3 class="card-title">Vendedores</h3>
                        <p class="card-description">Administra tu equipo de ventas</p>
                        <button class="card-btn">Ir a Vendedores</button>
                    </div>
                </div>
            </a>
        </div>
        
        <div class="col-md-6 col-lg-3">
            <a href="/planes" class="text-decoration-none">
                <div class="card card-custom card-planes">
                    <div class="card-body">
                        <i class="fas fa-mobile-alt card-icon"></i>
                        <h3 class="card-title">Planes</h3>
                        <p class="card-description">Crea y gestiona los planes telefónicos</p>
                        <button class="card-btn">Ir a Planes</button>
                    </div>
                </div>
            </a>
        </div>
        
        <div class="col-md-6 col-lg-3">
            <a href="/ventas" class="text-decoration-none">
                <div class="card card-custom card-ventas">
                    <div class="card-body">
                        <i class="fas fa-chart-line card-icon"></i>
                        <h3 class="card-title">Ventas</h3>
                        <p class="card-description">Registra y gestiona las ventas</p>
                        <button class="card-btn">Ir a Ventas</button>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>

<div class="container">
    <div class="stats-section">
        <div class="row">
            <div class="col-md-3 stat-item">
                <i class="fas fa-th-large stat-icon"></i>
                <div class="stat-number">4</div>
                <div class="stat-label">Módulos Disponibles</div>
            </div>
            <div class="col-md-3 stat-item">
                <i class="fas fa-check-circle stat-icon"></i>
                <div class="stat-number">100%</div>
                <div class="stat-label">Interfaz Intuitiva</div>
            </div>
            <div class="col-md-3 stat-item">
                <i class="fas fa-clock stat-icon"></i>
                <div class="stat-number">24/7</div>
                <div class="stat-label">Accesibilidad</div>
            </div>
            <div class="col-md-3 stat-item">
                <i class="fas fa-bolt stat-icon"></i>
                <div class="stat-number">⚡</div>
                <div class="stat-label">Rápido y Eficiente</div>
            </div>
        </div>
    </div>
</div>

<div th:replace="navegacion :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
