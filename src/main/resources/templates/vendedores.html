<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="navegacion :: head">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/scripts.js"></script>
    <style>
        .search-container {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div th:replace="navegacion :: navbar"></div>

<div class="page-header">
    <div class="container">
        <h2><i class="fas fa-user-tie me-3"></i>Gestión de Vendedores</h2>
        <p>Administra tu equipo de ventas</p>
    </div>
</div>

<div class="container mb-5">
    <div class="table-container">
        <div class="mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <a th:if="${session.isAdmin}" href="/nuevoVendedor" class="btn btn-primary-custom">
                <i class="fas fa-plus me-2"></i>Nuevo Vendedor
            </a>
            <div th:if="${session.isAdmin}" class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Buscar vendedor...">
            </div>
        </div>
        
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <div th:if="${#lists.isEmpty(vendedores)}" class="empty-state">
            <i class="fas fa-user-slash"></i>
            <h3>No hay vendedores registrados</h3>
            <p>Aún no hay vendedores en el sistema.</p>
        </div>
        
        <div th:if="${!#lists.isEmpty(vendedores)}">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Cédula</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Dirección</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="vendedor : ${vendedores}">
                            <td th:text="${vendedor.id}"></td>
                            <td th:text="${vendedor.nombre + ' ' + (vendedor.apellido != null ? vendedor.apellido : '')}"></td>
                            <td th:text="${vendedor.cedula}"></td>
                            <td th:text="${vendedor.correo}"></td>
                            <td th:text="${vendedor.telefono}"></td>
                            <td th:text="${vendedor.direccion}"></td>
                            <td>
                                <a th:href="@{/editarVendedor/{id}(id=${vendedor.id})}"
                                   class="btn btn-sm btn-action btn-warning-custom"
                                   data-bs-toggle="tooltip" data-bs-placement="top" title="Editar vendedor">
                                    <i class="fas fa-edit"></i> Editar
                                </a>
                                <a th:if="${session.isAdmin}" th:href="@{/eliminarVendedor/{id}(id=${vendedor.id})}"
                                   class="btn btn-sm btn-action btn-danger-custom"
                                   onclick="return confirm('¿Eliminar vendedor?')"
                                   data-bs-toggle="tooltip" data-bs-placement="top" title="Eliminar vendedor">
                                    <i class="fas fa-trash-alt"></i> Eliminar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="navegacion :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    setupSearch('searchInput', '.table');
    initTooltips();
</script>
</body>
</html>
