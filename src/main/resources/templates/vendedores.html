<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="navegacion :: head"></head>
<body>
<div th:replace="navegacion :: navbar"></div>

<div class="container mt-4">
    <h2>👔 Gestión de Vendedores</h2>
    <a href="/nuevoVendedor" class="btn btn-primary mb-3">➕ Nuevo Vendedor</a>

    <table class="table table-striped">
        <thead class="table-dark">
            <tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Acciones</th></tr>
        </thead>
        <tbody>
            <tr th:each="vendedor : ${vendedores}">
                <td th:text="${vendedor.id}"></td>
                <td th:text="${vendedor.nombre}"></td>
                <td th:text="${vendedor.correo}"></td>
                <td th:text="${vendedor.telefono}"></td>
                <td>
                    <a th:href="@{/editarVendedor/{id}(id=${vendedor.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{/eliminarVendedor/{id}(id=${vendedor.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar vendedor?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
