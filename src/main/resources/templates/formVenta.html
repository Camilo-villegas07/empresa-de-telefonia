<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="navegacion :: head">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div th:replace="navegacion :: navbar"></div>

<div class="page-header">
    <div class="container">
        <h2><i class="fas fa-shopping-cart me-3"></i>Registro de Venta</h2>
        <p>Completa el formulario para registrar una nueva venta</p>
    </div>
</div>

<div class="container">
    <div class="form-container">
        <form th:action="@{/guardarVenta}" th:object="${venta}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label for="cliente" class="form-label">Cliente</label>
                <select class="form-select" id="cliente" th:field="*{cliente}" required>
                    <option value="">Seleccionar cliente</option>
                    <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nombre + ' ' + (cliente.apellido != null ? cliente.apellido : '')}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="vendedor" class="form-label">Vendedor</label>
                <select class="form-select" id="vendedor" th:field="*{vendedor}" required>
                    <option value="">Seleccionar vendedor</option>
                    <option th:each="vendedor : ${vendedores}" th:value="${vendedor.id}" th:text="${vendedor.nombre + ' ' + (vendedor.apellido != null ? vendedor.apellido : '')}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="plan" class="form-label">Plan</label>
                <select class="form-select" id="plan" th:field="*{plan}" required>
                    <option value="">Seleccionar plan</option>
                    <option th:each="plan : ${planes}" th:value="${plan.id}" th:text="${plan.nombre}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="fechaVenta" class="form-label">Fecha</label>
                <input type="date" class="form-control" id="fechaVenta" th:field="*{fechaVenta}" required>
            </div>
            <button type="submit" class="btn btn-primary-custom">
                <i class="fas fa-save me-2"></i>Guardar Venta
            </button>
        </form>
    </div>
</div>

<div th:replace="navegacion :: footer"></div>

<script>
    validateForm('ventaForm');
</script></body></html>
