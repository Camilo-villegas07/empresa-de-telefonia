<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="navegacion :: head">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div th:replace="navegacion :: navbar"></div>

<div class="page-header">
    <div class="container">
        <h2><i class="fas fa-user-tie me-3"></i>Registro de Vendedor</h2>
        <p>Completa el formulario para registrar un nuevo vendedor</p>
    </div>
</div>

<div class="container">
    <div class="form-container">
        <form th:action="@{/guardarVendedor}" th:object="${vendedor}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
            </div>
            <div class="mb-3">
                <label for="apellido" class="form-label">Apellido</label>
                <input type="text" class="form-control" id="apellido" th:field="*{apellido}" required>
            </div>
            <div class="mb-3">
                <label for="cedula" class="form-label">Cédula</label>
                <input type="text" class="form-control" id="cedula" th:field="*{cedula}" required>
            </div>
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="text" class="form-control" id="telefono" th:field="*{telefono}" required>
            </div>
            <div class="mb-3">
                <label for="correo" class="form-label">Correo</label>
                <input type="email" class="form-control" id="correo" th:field="*{correo}" required>
            </div>
            <div class="mb-3">
                <label for="direccion" class="form-label">Dirección</label>
                <input type="text" class="form-control" id="direccion" th:field="*{direccion}" required>
            </div>
            <button type="submit" class="btn btn-primary-custom">
                <i class="fas fa-save me-2"></i>Guardar Vendedor
            </button>
        </form>
    </div>
</div>

<div th:replace="navegacion :: footer"></div>

<script>
    validateForm('vendedorForm');
</script></body></html>
