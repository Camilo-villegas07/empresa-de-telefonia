<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="navegacion :: head">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div th:replace="navegacion :: navbar"></div>

<div class="page-header">
    <div class="container">
        <h2><i class="fas fa-mobile-alt me-3"></i>Registro de Plan</h2>
        <p>Completa el formulario para registrar un nuevo plan telefónico</p>
    </div>
</div>

<div class="container">
    <div class="form-container">
        <form th:action="@{/guardarPlan}" th:object="${plan}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre del Plan</label>
                <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
            </div>
            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label for="precio" class="form-label">Precio Mensual</label>
                <input type="number" class="form-control" id="precio" th:field="*{precio}" step="0.01" required>
            </div>
            <div class="mb-3">
                <label for="gigas" class="form-label">Gigas (GB)</label>
                <input type="number" class="form-control" id="gigas" th:field="*{gigas}" required>
            </div>
            <button type="submit" class="btn btn-primary-custom">
                <i class="fas fa-save me-2"></i>Guardar Plan
            </button>
        </form>
    </div>
</div>

<div th:replace="navegacion :: footer"></div>

<script>
    validateForm('planForm');
</script></body></html>
