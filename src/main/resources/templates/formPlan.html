<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="navegacion :: head">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .form-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 600px;
            margin: 40px auto;
            animation: fadeInUp 0.6s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .form-title {
            color: #333;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-title i {
            margin-right: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .form-label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }
        
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-success-custom {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            padding: 12px 30px;
            border-radius: 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-success-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
        }
        
        .btn-secondary-custom {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            border: none;
            padding: 12px 30px;
            border-radius: 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-secondary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.4);
        }
    </style>
</head>
<body>
<div th:replace="navegacion :: navbar"></div>

<div class="container">
    <div class="form-container">
        <h2 class="form-title">
            <i class="fas fa-mobile-alt"></i>
            <span th:text="${plan.id} ? 'Editar Plan' : 'Nuevo Plan'"></span>
        </h2>
        <form th:action="@{/guardarPlan}" th:object="${plan}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label class="form-label">Nombre del plan *</label>
                <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ingrese el nombre del plan">
            </div>
            <div class="mb-3">
                <label class="form-label">Precio (COP) *</label>
                <input type="number" step="0.01" th:field="*{precio}" class="form-control" required placeholder="Ingrese el precio">
            </div>
            <div class="mb-3">
                <label class="form-label">Gigas (GB) *</label>
                <input type="number" th:field="*{gigas}" class="form-control" required placeholder="Ingrese los gigas">
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea th:field="*{descripcion}" class="form-control" rows="3" placeholder="Ingrese la descripción del plan"></textarea>
            </div>
            <button type="submit" class="btn btn-success-custom">
                <i class="fas fa-save me-2"></i>Guardar
            </button>
            <a href="/planes" class="btn btn-secondary-custom">
                <i class="fas fa-times me-2"></i>Cancelar
            </a>
        </form>
    </div>
</div>

<div th:replace="navegacion :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
