<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="navegacion :: head"></head>
<body>
<div th:replace="navegacion :: navbar"></div>

<div class="container mt-4">
    <h2 th:text="${plan.id} ? '✏️ Editar Plan' : '➕ Nuevo Plan'"></h2>
    <form th:action="@{/guardarPlan}" th:object="${plan}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Nombre del plan *</label>
            <input type="text" th:field="*{nombre}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Precio (COP) *</label>
            <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Gigas (GB) *</label>
            <input type="number" th:field="*{gigas}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea th:field="*{descripcion}" class="form-control" rows="2"></textarea>
        </div>
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="/planes" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
