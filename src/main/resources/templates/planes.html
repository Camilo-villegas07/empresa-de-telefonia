<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="navegacion :: head">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/scripts.js"></script>
    <style>
        .search-container {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div th:replace="navegacion :: navbar"></div>

<div class="page-header">
    <div class="container">
        <h2><i class="fas fa-mobile-alt me-3"></i>Planes Telefónicos</h2>
        <p>Crea y gestiona los planes telefónicos</p>
    </div>
</div>

<div class="container mb-5">
    <div class="table-container">
        <div class="mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <a href="/nuevoPlan" class="btn btn-primary-custom">
                <i class="fas fa-plus me-2"></i>Nuevo Plan
            </a>
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Buscar plan...">
            </div>
        </div>
        
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <div th:if="${#lists.isEmpty(planes)}" class="empty-state">
            <i class="fas fa-mobile-slash"></i>
            <h3>No hay planes registrados</h3>
            <p>Aún no hay planes en el sistema.</p>
        </div>
        
        <div th:if="${!#lists.isEmpty(planes)}">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Gigas</th>
                            <th>Descripción</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="plan : ${planes}">
                            <td th:text="${plan.id}"></td>
                            <td th:text="${plan.nombre}"></td>
                            <td th:text="'$' + ${plan.precio}"></td>
                            <td th:text="${plan.gigas} + ' GB'"></td>
                            <td th:text="${plan.descripcion}"></td>
                            <td>
                                <a th:href="@{/editarPlan/{id}(id=${plan.id})}" 
                                   class="btn btn-sm btn-action btn-warning-custom" 
                                   data-bs-toggle="tooltip" data-bs-placement="top" title="Editar plan">
                                    <i class="fas fa-edit"></i> Editar
                                </a>
                                <a th:href="@{/eliminarPlan/{id}(id=${plan.id})}" 
                                   class="btn btn-sm btn-action btn-danger-custom" 
                                   onclick="return confirm('¿Eliminar plan?')"
                                   data-bs-toggle="tooltip" data-bs-placement="top" title="Eliminar plan">
                                    <i class="fas fa-trash-alt"></i> Eliminar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="navegacion :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    setupSearch('searchInput', '.table');
    initTooltips();
</script>
</body>
</html>
