<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="navegacion :: head"></head>
<body>
<div th:replace="navegacion :: navbar"></div>

<div class="container mt-4">
    <h2>📱 Planes Telefónicos</h2>
    <a href="/nuevoPlan" class="btn btn-primary mb-3">➕ Nuevo Plan</a>

    <table class="table table-striped">
        <thead class="table-dark">
            <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Gigas</th><th>Descripción</th><th>Acciones</th></tr>
        </thead>
        <tbody>
            <tr th:each="plan : ${planes}">
                <td th:text="${plan.id}"></td>
                <td th:text="${plan.nombre}"></td>
                <td th:text="'$' + ${plan.precio}"></td>
                <td th:text="${plan.gigas} + ' GB'"></td>
                <td th:text="${plan.descripcion}"></td>
                <td>
                    <a th:href="@{/editarPlan/{id}(id=${plan.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{/eliminarPlan/{id}(id=${plan.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar plan?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
