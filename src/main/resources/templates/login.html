<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Cercanía Móvil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .form-control {
            border-radius: 10px;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #6c757d;
            box-shadow: 0 0 0 0.2rem rgba(108, 117, 125, 0.25);
            outline: none;
        }
        
        .form-control:focus-visible {
            border-color: #6c757d;
            box-shadow: 0 0 0 0.2rem rgba(108, 117, 125, 0.25);
            outline: 2px solid #6c757d;
            outline-offset: 2px;
        }
        
        .btn-login:focus-visible {
            outline: 2px solid #6c757d;
            outline-offset: 2px;
        }
        
        .nav-link:focus-visible {
            outline: 2px solid #6c757d;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="/images/logo.jpeg" alt="Cercanía Móvil" class="login-logo">
        <h1 class="login-title">Iniciar sesión</h1>
        <p class="login-subtitle">Bienvenido de nuevo a Cercanía Móvil</p>
        
        <div th:if="${param.error}" class="error-message">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:if="${param.error == 'usuario_no_encontrado'}">Usuario no encontrado</span>
            <span th:if="${param.error == 'password_incorrecto'}">Contraseña incorrecta</span>
            <span th:if="${param.error == 'usuario_inactivo'}">Usuario inactivo. Contacte al administrador.</span>
            <span th:if="${param.error == null}">Usuario o contraseña incorrectos</span>
        </div>
        
        <div th:if="${param.registro == 'exitoso'}" class="success-message">
            <i class="fas fa-check-circle me-2"></i>Registro exitoso. Ahora puedes iniciar sesión.
        </div>
        
        <form th:action="@{/login}" method="post" aria-label="Formulario de inicio de sesión">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" class="form-control" id="username" name="username" required placeholder="Ingrese su usuario o correo" aria-label="Nombre de usuario o correo electrónico" aria-required="true">
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" class="form-control" id="password" name="password" required placeholder="Ingrese su contraseña" aria-label="Contraseña" aria-required="true">
            </div>
            
            <button type="submit" class="btn btn-login" aria-label="Iniciar sesión">
                <i class="fas fa-sign-in-alt me-2"></i>Ingresar
            </button>
        </form>
        
        <div class="register-link">
            <p>No tienes una cuenta? <a href="/registro">Regístrate aquí</a></p>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
