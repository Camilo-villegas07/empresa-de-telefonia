<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Cercanía Móvil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 50px 40px;
            max-width: 450px;
            width: 100%;
            margin: 20px;
            animation: fadeInUp 0.6s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-icon {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-icon i {
            font-size: 4rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .login-title {
            text-align: center;
            color: #333;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .login-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }
        
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            font-size: 1.1rem;
        }
        
        .form-control {
            border-radius: 10px;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            outline: none;
        }
        
        .form-control:focus-visible {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            outline: 2px solid #667eea;
            outline-offset: 2px;
        }
        
        .btn-login:focus-visible {
            outline: 2px solid #667eea;
            outline-offset: 2px;
        }
        
        .nav-link:focus-visible {
            outline: 2px solid #667eea;
            outline-offset: 2px;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            color: white;
            font-weight: bold;
            width: 100%;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }
        
        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .register-link a:hover {
            text-decoration: underline;
            color: #764ba2;
        }
        
        .error-message {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 500;
            animation: shake 0.5s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .success-message {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-icon">
            <i class="fas fa-sign-in-alt"></i>
        </div>
        
        <h1 class="login-title">Iniciar sesión</h1>
        <p class="login-subtitle">Bienvenido de nuevo a Cercanía Móvil</p>
        
        <div th:if="${param.error}" class="error-message">
            <i class="fas fa-exclamation-circle me-2"></i>Usuario o contraseña incorrectos
        </div>
        
        <div th:if="${param.registro == 'exitoso'}" class="success-message">
            <i class="fas fa-check-circle me-2"></i>Registro exitoso. Ahora puedes iniciar sesión.
        </div>
        
        <form th:action="@{/login}" method="post" aria-label="Formulario de inicio de sesión">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" class="form-control" id="username" name="username" required placeholder="Ingrese su usuario o correo" aria-label="Nombre de usuario o correo electrónico" aria-required="true">
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" class="form-control" id="password" name="password" required placeholder="Ingrese su contraseña" aria-label="Contraseña" aria-required="true">
            </div>
            
            <button type="submit" class="btn btn-login" aria-label="Iniciar sesión">
                <i class="fas fa-sign-in-alt me-2"></i>Ingresar
            </button>
        </form>
        
        <div class="register-link">
            <p>No tienes una cuenta? <a href="/registro">Regístrate aquí</a></p>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
