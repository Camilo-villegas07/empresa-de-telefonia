<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="navegacion :: head">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/scripts.js"></script>
    <style>
        .search-container {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div th:replace="navegacion :: navbar"></div>

<div class="page-header">
    <div class="container">
        <h2><i class="fas fa-users me-3"></i>Gestión de Usuarios</h2>
        <p>Administra los usuarios del sistema</p>
    </div>
</div>

<div class="container mb-5">
    <div class="table-container">
        <div class="mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Buscar usuario...">
            </div>
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Email</th>
                        <th>Usuario</th>
                        <th>Teléfono</th>
                        <th>Cédula</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.id}"></td>
                        <td th:text="${usuario.nombre}"></td>
                        <td th:text="${usuario.apellido}"></td>
                        <td th:text="${usuario.email}"></td>
                        <td th:text="${usuario.username}"></td>
                        <td th:text="${usuario.telefono}"></td>
                        <td th:text="${usuario.cedula}"></td>
                        <td>
                            <span class="badge" th:class="'badge ' + ${usuario.activo ? 'badge-success' : 'badge-danger'}" th:text="${usuario.activo ? 'Activo' : 'Inactivo'}"></span>
                        </td>
                        <td>
                            <a th:if="${isAdmin}" th:href="@{/editarUsuario/{id}(id=${usuario.id})}" class="btn btn-action btn-primary-custom" data-bs-toggle="tooltip" data-bs-placement="top" title="Editar usuario">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a th:href="@{/activarUsuario/{id}(id=${usuario.id})}" class="btn btn-action btn-success-custom" data-bs-toggle="tooltip" data-bs-placement="top" title="Activar" th:if="${!usuario.activo}">
                                <i class="fas fa-check"></i>
                            </a>
                            <a th:href="@{/desactivarUsuario/{id}(id=${usuario.id})}" class="btn btn-action btn-warning-custom" data-bs-toggle="tooltip" data-bs-placement="top" title="Desactivar" th:if="${usuario.activo}">
                                <i class="fas fa-ban"></i>
                            </a>
                            <a th:href="@{/eliminarUsuario/{id}(id=${usuario.id})}" class="btn btn-action btn-danger-custom" data-bs-toggle="tooltip" data-bs-placement="top" title="Eliminar" onclick="return confirm('¿Estás seguro de eliminar este usuario?');">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="navegacion :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    setupSearch('searchInput', '.table');
    initTooltips();
</script>
</body>
</html>
