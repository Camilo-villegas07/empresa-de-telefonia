<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="navegacion :: head"></head>
<body>
<div th:replace="navegacion :: navbar"></div>

<div class="container mt-4">
    <h2>🔄 Cambiar Estado de Venta #<span th:text="${venta.id}"></span></h2>
    <form th:action="@{/actualizarEstadoVenta}" method="post">
        <input type="hidden" name="id" th:value="${venta.id}">

        <div class="mb-3">
            <label class="form-label">Estado actual:</label>
            <p class="form-control-plaintext">
                <span th:class="'badge ' + (${venta.estado} == 'ACTIVO' ? 'bg-success' : 
                                            (${venta.estado} == 'APROBADO' ? 'bg-info' : 
                                            (${venta.estado} == 'RECHAZADO' ? 'bg-danger' : 'bg-secondary')))"
                      th:text="${venta.estado}"></span>
            </p>
        </div>

        <div class="mb-3">
            <label class="form-label">Nuevo estado *</label>
            <select name="estado" class="form-select" required>
                <option th:each="est : ${T(com.telefonia.enums.EstadoVenta).values()}" 
                        th:value="${est.name()}" th:text="${est.name()}"
                        th:selected="${est.name() == venta.estado}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Observaciones (adicionales)</label>
            <textarea name="observaciones" class="form-control" rows="2" th:text="${venta.observaciones}"></textarea>
            <small class="text-muted">Puede agregar o modificar observaciones</small>
        </div>

        <button type="submit" class="btn btn-success">✅ Actualizar Estado</button>
        <a href="/ventas" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
