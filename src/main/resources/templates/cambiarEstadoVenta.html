<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="navegacion :: head">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .form-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 600px;
            margin: 40px auto;
            animation: fadeInUp 0.6s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .form-title {
            color: #333;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-title i {
            margin-right: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .form-label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }
        
        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .badge {
            padding: 8px 15px;
            font-weight: 600;
            border-radius: 20px;
        }
        
        .badge-activo {
            background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            color: white;
        }
        
        .badge-aprobado {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        
        .badge-rechazado {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }
        
        .badge-pendiente {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn-success-custom {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            padding: 12px 30px;
            border-radius: 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-success-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
        }
        
        .btn-secondary-custom {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            border: none;
            padding: 12px 30px;
            border-radius: 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-secondary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.4);
        }
    </style>
</head>
<body>
<div th:replace="navegacion :: navbar"></div>

<div class="container">
    <div class="form-container">
        <h2 class="form-title">
            <i class="fas fa-sync-alt"></i>
            Cambiar Estado de Venta #<span th:text="${venta.id}"></span>
        </h2>
        <form th:action="@{/actualizarEstadoVenta}" method="post">
            <input type="hidden" name="id" th:value="${venta.id}">

            <div class="mb-3">
                <label class="form-label">Estado actual:</label>
                <p class="form-control-plaintext">
                    <span th:if="${venta.estado == 'ACTIVO'}" class="badge badge-activo">
                        <i class="fas fa-check-circle me-1"></i>ACTIVO
                    </span>
                    <span th:if="${venta.estado == 'APROBADO'}" class="badge badge-aprobado">
                        <i class="fas fa-thumbs-up me-1"></i>APROBADO
                    </span>
                    <span th:if="${venta.estado == 'RECHAZADO'}" class="badge badge-rechazado">
                        <i class="fas fa-times-circle me-1"></i>RECHAZADO
                    </span>
                    <span th:if="${venta.estado != 'ACTIVO' && venta.estado != 'APROBADO' && venta.estado != 'RECHAZADO'}" class="badge badge-pendiente">
                        <i class="fas fa-clock me-1"></i>PENDIENTE
                    </span>
                </p>
            </div>

            <div class="mb-3">
                <label class="form-label">Nuevo estado *</label>
                <select name="estado" class="form-select" required>
                    <option th:each="est : ${T(com.telefonia.enums.EstadoVenta).values()}" 
                            th:value="${est.name()}" th:text="${est.name()}"
                            th:selected="${est.name() == venta.estado}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Observaciones (adicionales)</label>
                <textarea name="observaciones" class="form-control" rows="3" th:text="${venta.observaciones}" placeholder="Puede agregar o modificar observaciones"></textarea>
                <small class="text-muted">Puede agregar o modificar observaciones</small>
            </div>

            <button type="submit" class="btn btn-success-custom">
                <i class="fas fa-check me-2"></i>Actualizar Estado
            </button>
            <a href="/ventas" class="btn btn-secondary-custom">
                <i class="fas fa-times me-2"></i>Cancelar
            </a>
        </form>
    </div>
</div>

<div th:replace="navegacion :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
