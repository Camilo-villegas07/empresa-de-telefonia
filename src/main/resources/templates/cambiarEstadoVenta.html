<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="navegacion :: head">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div th:replace="navegacion :: navbar"></div>

<div class="page-header">
    <div class="container">
        <h2><i class="fas fa-exchange-alt me-3"></i>Cambiar Estado de Venta</h2>
        <p>Selecciona el nuevo estado para la venta</p>
    </div>
</div>

<div class="container">
    <div class="form-container">
        <form th:action="@{/actualizarEstadoVenta}" method="post">
            <input type="hidden" name="id" th:value="${venta.id}">
            <div class="mb-3">
                <label for="estado" class="form-label">Estado</label>
                <select class="form-select" id="estado" name="estado" required>
                    <option value="">Seleccionar estado</option>
                    <option value="PROSPECTO" th:selected="${venta.estado == 'PROSPECTO'}">Prospecto</option>
                    <option value="EN_TRAMITE" th:selected="${venta.estado == 'EN_TRAMITE'}">En Trámite</option>
                    <option value="APROBADO" th:selected="${venta.estado == 'APROBADO'}">Aprobado</option>
                    <option value="RECHAZADO" th:selected="${venta.estado == 'RECHAZADO'}">Rechazado</option>
                    <option value="ACTIVO" th:selected="${venta.estado == 'ACTIVO'}">Activo</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="observaciones" class="form-label">Observaciones</label>
                <textarea class="form-control" id="observaciones" name="observaciones" rows="3" th:text="${venta.observaciones}"></textarea>
            </div>
            <button type="submit" class="btn btn-primary-custom">
                <i class="fas fa-save me-2"></i>Guardar Cambios
            </button>
        </form>
    </div>
</div>

<div th:replace="navegacion :: footer"></div>

<script>
    validateForm('estadoForm');
</script></body></html>
