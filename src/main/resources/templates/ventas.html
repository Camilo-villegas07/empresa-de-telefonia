<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="navegacion :: head"></head>
<body>
<div th:replace="navegacion :: navbar"></div>

<div class="container mt-4">
    <h2>💰 Seguimiento de Ventas</h2>
    <a href="/nuevaVenta" class="btn btn-primary mb-3">➕ Nueva Venta</a>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th><th>Cliente</th><th>Vendedor</th><th>Plan</th><th>Fecha</th><th>Estado</th><th>Observaciones</th><th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="venta : ${ventas}">
                <td th:text="${venta.id}"></td>
                <td th:text="${venta.cliente.nombre}"></td>
                <td th:text="${venta.vendedor.nombre}"></td>
                <td th:text="${venta.plan.nombre}"></td>
                <td th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy')}"></td>
                <td>
                    <span th:class="'badge ' + (${venta.estado} == 'ACTIVO' ? 'bg-success' : 
                                                (${venta.estado} == 'APROBADO' ? 'bg-info' : 
                                                (${venta.estado} == 'RECHAZADO' ? 'bg-danger' : 'bg-secondary')))"
                          th:text="${venta.estado}"></span>
                </td>
                <td th:text="${venta.observaciones}"></td>
                <td>
                    <a th:href="@{/cambiarEstadoVenta/{id}(id=${venta.id})}" class="btn btn-sm btn-info">🔄 Cambiar Estado</a>
                    <a th:href="@{/eliminarVenta/{id}(id=${venta.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar venta?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
