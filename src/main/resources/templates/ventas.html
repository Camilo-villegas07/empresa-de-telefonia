<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="navegacion :: head">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/scripts.js"></script>
    <style>
        .search-container {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div th:replace="navegacion :: navbar"></div>

<div class="page-header">
    <div class="container">
        <h2><i class="fas fa-shopping-cart me-3"></i>Gestión de Ventas</h2>
        <p>Administra las ventas de planes telefónicos</p>
    </div>
</div>

<div class="container mb-5">
    <div class="table-container">
        <div class="mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <a href="/nuevaVenta" class="btn btn-primary-custom">
                <i class="fas fa-plus me-2"></i>Nueva Venta
            </a>
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar ventas...">
            </div>
        </div>
        
        <div th:if="${#lists.isEmpty(ventas)}" class="empty-state">
            <i class="fas fa-shopping-cart"></i>
            <h3>No hay ventas registradas</h3>
            <p>Aún no hay ventas en el sistema.</p>
        </div>
        
        <div th:if="${!#lists.isEmpty(ventas)}">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Vendedor</th>
                            <th>Plan</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="venta : ${ventas}">
                            <td th:text="${venta.id}"></td>
                            <td th:text="${venta.cliente.nombre}"></td>
                            <td th:text="${venta.vendedor.nombre}"></td>
                            <td th:text="${venta.plan.nombre}"></td>
                            <td th:text="${venta.fechaVenta}"></td>
                            <td>
                                <span class="badge" th:class="'badge ' + ${venta.estado == 'ACTIVO' ? 'badge-success' : venta.estado == 'RECHAZADO' ? 'badge-danger' : 'badge-warning'}" th:text="${venta.estado}"></span>
                            </td>
                            <td>
                                <a th:href="@{/editarVenta/{id}(id=${venta.id})}" class="btn btn-action btn-info-custom" data-bs-toggle="tooltip" data-bs-placement="top" title="Editar">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a th:href="@{/cambiarEstadoVenta/{id}(id=${venta.id})}" class="btn btn-action btn-warning-custom" data-bs-toggle="tooltip" data-bs-placement="top" title="Cambiar estado">
                                    <i class="fas fa-exchange-alt"></i>
                                </a>
                                <a th:href="@{/eliminarVenta/{id}(id=${venta.id})}" class="btn btn-action btn-danger-custom" data-bs-toggle="tooltip" data-bs-placement="top" title="Eliminar" onclick="return confirm('¿Estás seguro de eliminar esta venta?');">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="navegacion :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    setupSearch('searchInput', '.table');
    initTooltips();
</script>
</body>
</html>
