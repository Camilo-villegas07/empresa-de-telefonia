<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="navegacion :: head">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #f8f9fa;
            min-height: 100vh;
            transition: background 0.3s ease;
        }
        
        [data-theme="dark"] body {
            background: #1a1a2e;
        }
        
        .page-header {
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            color: white;
            padding: 50px 0;
            margin-bottom: 30px;
            border-radius: 0 0 30px 30px;
            transition: background 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .page-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 15s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        [data-theme="dark"] .page-header {
            background: linear-gradient(135deg, #2a2a4a 0%, #3a3a5a 100%);
        }
        
        .page-header h2 {
            margin: 0;
            font-weight: bold;
            font-size: 2.2rem;
            position: relative;
            z-index: 1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .page-header p {
            margin: 10px 0 0 0;
            opacity: 0.95;
            position: relative;
            z-index: 1;
            font-size: 1.1rem;
        }
        
        .table-container {
            background: white;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            padding: 35px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 107, 107, 0.1);
        }
        
        .table-container:hover {
            box-shadow: 0 20px 50px rgba(255, 107, 107, 0.15);
            transform: translateY(-5px);
        }
        
        [data-theme="dark"] .table-container {
            background: #1f1f3a;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            border: 1px solid rgba(102, 126, 234, 0.2);
        }
        
        [data-theme="dark"] .table-container:hover {
            box-shadow: 0 20px 50px rgba(102, 126, 234, 0.25);
        }
        
        .table {
            margin-bottom: 0;
        }
        
        .table thead th {
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            color: white;
            border: none;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            padding: 15px 12px;
            position: relative;
        }
        
        .table thead th::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
        }
        
        .table tbody tr {
            transition: all 0.3s ease;
        }
        
        .table tbody tr:hover {
            background-color: #f8f9fa;
            transform: scale(1.01);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        [data-theme="dark"] .table tbody tr:hover {
            background-color: #2a2a4a;
        }
        
        .table td {
            vertical-align: middle;
        }
        
        .badge {
            padding: 8px 18px;
            font-weight: 700;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            display: inline-block;
        }
        
        .badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        
        .badge-activo {
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
        }
        
        .badge-aprobado {
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
        }
        
        .badge-rechazado {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
        }
        
        .badge-pendiente {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .btn-action {
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin: 3px;
            border: none;
            position: relative;
            overflow: hidden;
        }
        
        .btn-action::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .btn-action:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .btn-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        
        .btn-primary-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-info-custom {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
        }
        
        .btn-danger-custom {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            border: none;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #ddd;
        }
        
        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        
        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .table tbody tr {
            animation: fadeInLeft 0.5s ease forwards;
            opacity: 0;
        }
        
        .table tbody tr:nth-child(1) { animation-delay: 0.1s; }
        .table tbody tr:nth-child(2) { animation-delay: 0.2s; }
        .table tbody tr:nth-child(3) { animation-delay: 0.3s; }
        .table tbody tr:nth-child(4) { animation-delay: 0.4s; }
        .table tbody tr:nth-child(5) { animation-delay: 0.5s; }
        .table tbody tr:nth-child(6) { animation-delay: 0.6s; }
        .table tbody tr:nth-child(7) { animation-delay: 0.7s; }
        .table tbody tr:nth-child(8) { animation-delay: 0.8s; }
        .table tbody tr:nth-child(9) { animation-delay: 0.9s; }
        .table tbody tr:nth-child(10) { animation-delay: 1.0s; }
        
        @media (max-width: 768px) {
            .page-header h2 {
                font-size: 1.5rem;
            }
            
            .page-header p {
                font-size: 0.9rem;
            }
            
            .table-container {
                padding: 20px;
                border-radius: 15px;
            }
            
            .table thead th {
                font-size: 0.75rem;
                padding: 10px 8px;
            }
            
            .table td {
                font-size: 0.85rem;
            }
            
            .btn-action {
                padding: 6px 12px;
                font-size: 0.75rem;
            }
            
            .badge {
                padding: 5px 10px;
                font-size: 0.75rem;
            }
        }
        
        @media (max-width: 576px) {
            .page-header {
                padding: 30px 0;
                border-radius: 0 0 15px 15px;
            }
            
            .page-header h2 {
                font-size: 1.3rem;
            }
            
            .table-container {
                padding: 15px;
            }
            
            .table-responsive {
                overflow-x: auto;
            }
            
            .btn-action {
                padding: 5px 10px;
                font-size: 0.7rem;
                margin: 2px;
            }
        }
    </style>
</head>
<body>
<div th:replace="navegacion :: navbar"></div>

<div class="page-header">
    <div class="container">
        <h2><i class="fas fa-chart-line me-3"></i>Seguimiento de Ventas</h2>
        <p>Registra y gestiona las ventas</p>
    </div>
</div>

<div class="container mb-5">
    <div class="table-container">
        <div class="mb-4">
            <a href="/nuevaVenta" class="btn btn-primary-custom">
                <i class="fas fa-plus me-2"></i>Nueva Venta
            </a>
        </div>
        
        <div th:if="${#lists.isEmpty(ventas)}" class="empty-state">
            <i class="fas fa-chart-bar"></i>
            <h3>No hay ventas registradas</h3>
            <p>Aún no hay ventas en el sistema.</p>
        </div>
        
        <div th:if="${!#lists.isEmpty(ventas)}">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Vendedor</th>
                            <th>Plan</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Observaciones</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="venta : ${ventas}">
                            <td th:text="${venta.id}"></td>
                            <td th:text="${venta.cliente.nombre}"></td>
                            <td th:text="${venta.vendedor.nombre}"></td>
                            <td th:text="${venta.plan.nombre}"></td>
                            <td th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy')}"></td>
                            <td>
                                <span th:if="${venta.estado == 'ACTIVO'}" class="badge badge-activo">
                                    <i class="fas fa-check-circle me-1"></i>ACTIVO
                                </span>
                                <span th:if="${venta.estado == 'APROBADO'}" class="badge badge-aprobado">
                                    <i class="fas fa-thumbs-up me-1"></i>APROBADO
                                </span>
                                <span th:if="${venta.estado == 'RECHAZADO'}" class="badge badge-rechazado">
                                    <i class="fas fa-times-circle me-1"></i>RECHAZADO
                                </span>
                                <span th:if="${venta.estado != 'ACTIVO' && venta.estado != 'APROBADO' && venta.estado != 'RECHAZADO'}" class="badge badge-pendiente">
                                    <i class="fas fa-clock me-1"></i>PENDIENTE
                                </span>
                            </td>
                            <td th:text="${venta.observaciones}"></td>
                            <td>
                                <a th:href="@{/cambiarEstadoVenta/{id}(id=${venta.id})}" 
                                   class="btn btn-sm btn-action btn-info-custom" 
                                   title="Cambiar estado">
                                    <i class="fas fa-sync-alt"></i> Cambiar
                                </a>
                                <a th:href="@{/eliminarVenta/{id}(id=${venta.id})}" 
                                   class="btn btn-sm btn-action btn-danger-custom" 
                                   onclick="return confirm('¿Eliminar venta?')"
                                   title="Eliminar venta">
                                    <i class="fas fa-trash-alt"></i> Eliminar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="navegacion :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
