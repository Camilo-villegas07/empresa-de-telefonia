<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Cercanía Móvil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        
        .registro-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
            margin: 20px auto;
        }
        
        .logos-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .logo {
            max-height: 60px;
            max-width: 120px;
            object-fit: contain;
        }
        
        .registro-title {
            text-align: center;
            color: #333;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
        }
        
        .section-title {
            color: #667eea;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .form-control {
            border-radius: 8px;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .form-control:disabled {
            background-color: #f8f9fa;
            cursor: not-allowed;
        }
        
        .btn-crear-cuenta {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            color: white;
            font-weight: bold;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 20px;
            font-size: 1.1rem;
        }
        
        .btn-crear-cuenta:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(220, 53, 69, 0.4);
        }
        
        .login-link {
            text-align: center;
            margin-top: 25px;
        }
        
        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        .direccion-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .direccion-grid .col-md-6 {
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="registro-container">
        <div class="logos-container">
            <img src="/images/claro-logo.png" alt="Claro" class="logo" onerror="this.style.display='none'">
            <img src="/images/ancla-logo.png" alt="Ancla Telecomunicaciones" class="logo" onerror="this.style.display='none'">
        </div>
        
        <h1 class="registro-title">Registro</h1>
        
        <form th:action="@{/registro}" method="post">
            <!-- Sección de Datos Personales -->
            <div class="mb-4">
                <h3 class="section-title">Datos Personales</h3>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nombre" class="form-label">Nombre completo *</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required placeholder="Ingrese su nombre completo">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Correo electrónico *</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="Ingrese su correo electrónico">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="username" class="form-label">Usuario *</label>
                        <input type="text" class="form-control" id="username" name="username" required placeholder="Ingrese su nombre de usuario">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="telefono" class="form-label">Teléfono *</label>
                        <input type="tel" class="form-control" id="telefono" name="telefono" required placeholder="Ingrese su teléfono">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">Contraseña *</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Ingrese su contraseña">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="confirmPassword" class="form-label">Confirmar contraseña *</label>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required placeholder="Confirme su contraseña">
                    </div>
                </div>
            </div>
            
            <!-- Sección de Ubicación -->
            <div class="mb-4">
                <h3 class="section-title">Ubicación</h3>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="departamento" class="form-label">Departamento *</label>
                        <select class="form-select" id="departamento" name="departamento" required>
                            <option value="">Seleccione</option>
                            <option value="antioquia">Antioquia</option>
                            <option value="bogota">Bogotá D.C.</option>
                            <option value="valle">Valle del Cauca</option>
                            <option value="santander">Santander</option>
                            <option value="atlantico">Atlántico</option>
                            <option value="bolivar">Bolívar</option>
                            <option value="cordoba">Córdoba</option>
                            <option value="cundinamarca">Cundinamarca</option>
                            <option value="narino">Nariño</option>
                            <option value="boyaca">Boyacá</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="ciudad" class="form-label">Ciudad *</label>
                        <select class="form-select" id="ciudad" name="ciudad" required disabled>
                            <option value="">Seleccione primero un departamento</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Sección de Dirección -->
            <div class="mb-4">
                <h3 class="section-title">Dirección</h3>
                <div class="row mb-3">
                    <div class="col-md-12">
                        <label for="tipoDireccion" class="form-label">Tipo de dirección</label>
                        <input type="text" class="form-control" id="tipoDireccion" name="tipoDireccion" value="URBANA EN COLOMBIA" readonly>
                    </div>
                </div>
                <div class="direccion-grid">
                    <div class="mb-3">
                        <label for="tipoVia" class="form-label">Tipo vía *</label>
                        <select class="form-select" id="tipoVia" name="tipoVia" required>
                            <option value="">Seleccione</option>
                            <option value="calle">Calle</option>
                            <option value="carrera">Carrera</option>
                            <option value="avenida">Avenida</option>
                            <option value="diagonal">Diagonal</option>
                            <option value="transversal">Transversal</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="numeroVia" class="form-label">Número vía *</label>
                        <input type="text" class="form-control" id="numeroVia" name="numeroVia" required placeholder="Ej: 65">
                    </div>
                    <div class="mb-3">
                        <label for="prefijoVia" class="form-label">Prefijo vía</label>
                        <select class="form-select" id="prefijoVia" name="prefijoVia">
                            <option value="">---</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                            <option value="E">E</option>
                            <option value="K">K</option>
                            <option value="M">M</option>
                            <option value="N">N</option>
                            <option value="S">S</option>
                            <option value="O">O</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="cardinalidadVia" class="form-label">Cardinalidad vía</label>
                        <select class="form-select" id="cardinalidadVia" name="cardinalidadVia">
                            <option value="">---</option>
                            <option value="Norte">Norte</option>
                            <option value="Sur">Sur</option>
                            <option value="Este">Este</option>
                            <option value="Oeste">Oeste</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="numeroViaCruce" class="form-label">Número vía cruce</label>
                        <input type="text" class="form-control" id="numeroViaCruce" name="numeroViaCruce" placeholder="Ej: 43">
                    </div>
                    <div class="mb-3">
                        <label for="prefijoViaCruce" class="form-label">Prefijo vía cruce</label>
                        <select class="form-select" id="prefijoViaCruce" name="prefijoViaCruce">
                            <option value="">---</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                            <option value="E">E</option>
                            <option value="K">K</option>
                            <option value="M">M</option>
                            <option value="N">N</option>
                            <option value="S">S</option>
                            <option value="O">O</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="cardinalidadViaCruce" class="form-label">Cardinalidad vía cruce</label>
                        <select class="form-select" id="cardinalidadViaCruce" name="cardinalidadViaCruce">
                            <option value="">---</option>
                            <option value="Norte">Norte</option>
                            <option value="Sur">Sur</option>
                            <option value="Este">Este</option>
                            <option value="Oeste">Oeste</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="numeroPlaca" class="form-label">Número placa *</label>
                        <input type="text" class="form-control" id="numeroPlaca" name="numeroPlaca" required placeholder="Ej: 40">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="unidadUrbanizacion" class="form-label">Unidad / urbanización / complemento</label>
                    <input type="text" class="form-control" id="unidadUrbanizacion" name="unidadUrbanizacion" placeholder="Ej: Urbanización Manzanares Bloque 4 Apto 302">
                </div>
            </div>
            
            <button type="submit" class="btn btn-crear-cuenta">Crear cuenta</button>
        </form>
        
        <div class="login-link">
            <p>¿Ya tienes cuenta? <a href="/login">Ingresa aquí</a></p>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Datos de ciudades por departamento
        const ciudadesPorDepartamento = {
            antioquia: ['Medellín', 'Envigado', 'Bello', 'Itagüí', 'Rionegro'],
            bogota: ['Bogotá D.C.'],
            valle: ['Cali', 'Palmira', 'Bugalagrande', 'Tuluá'],
            santander: ['Bucaramanga', 'Floridablanca', 'Girón', 'Piedecuesta'],
            atlantico: ['Barranquilla', 'Soledad', 'Malambo'],
            bolivar: ['Cartagena', 'Magangué', 'Turbaco'],
            cordoba: ['Montería', 'Lorica', 'Cereté'],
            cundinamarca: ['Soacha', 'Chía', 'Facatativá', 'Zipaquirá'],
            narino: ['Pasto', 'Ipiales', 'Tumaco'],
            boyaca: ['Tunja', 'Duitama', 'Sogamoso']
        };
        
        // Manejar cambio de departamento
        document.getElementById('departamento').addEventListener('change', function() {
            const departamento = this.value;
            const ciudadSelect = document.getElementById('ciudad');
            
            // Limpiar opciones anteriores
            ciudadSelect.innerHTML = '<option value="">Seleccione</option>';
            
            if (departamento && ciudadesPorDepartamento[departamento]) {
                ciudadesPorDepartamento[departamento].forEach(function(ciudad) {
                    const option = document.createElement('option');
                    option.value = ciudad.toLowerCase();
                    option.textContent = ciudad;
                    ciudadSelect.appendChild(option);
                });
                ciudadSelect.disabled = false;
            } else {
                ciudadSelect.innerHTML = '<option value="">Seleccione primero un departamento</option>';
                ciudadSelect.disabled = true;
            }
        });
    </script>
</body>
</html>
